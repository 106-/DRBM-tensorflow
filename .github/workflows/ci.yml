name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Train (generative, 10 epochs)
        run: uv run python train_generative.py config/generative/h50/continuous.json 10
